# MPD configuration (~/.config/mpd/mpd.conf)

# Files and directories
music_directory     "~/music"
playlist_directory  "~/.local/share/mpd/playlists"
db_file             "~/.local/share/mpd/database"
state_file          "~/.local/state/mpd/state"
sticker_file        "~/.local/share/mpd/sticker.sql"

# Network binding (allow MALP and local network clients)
bind_to_address     "0.0.0.0"
port                "6600"

# Automatically update database when files change in music_directory
auto_update         "yes"

# Audio output via ALSA (HDMI audio with internal software volume control)
audio_output {
    type            "alsa"
    name            "HDMI Audio"
    device          "default"
    mixer_type      "software"
}
